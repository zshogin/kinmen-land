version: '3.8'

services:
  # ==========================================================
  # 空間資料庫: PostgreSQL 15 + PostGIS 3.3
  # ==========================================================
  db:
    image: postgis/postgis:15-3.3
    container_name: kinmen-land-db
    restart: always
    environment:
      POSTGRES_USER: kinmen_user
      POSTGRES_PASSWORD: kinmen_password_2026
      POSTGRES_DB: kinmen_land
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/postgis_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinmen_user -d kinmen_land"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 金門地政雲 WebGIS 服務 (FastAPI + 自動排程同步管線)
  # ==========================================================
  web:
    build: .
    container_name: kinmen-land-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://kinmen_user:kinmen_password_2026@db:5432/kinmen_land
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./kinmen_real_estate.json:/app/kinmen_real_estate.json:ro
      - ./kinmen_sections.json:/app/kinmen_sections.json:ro

volumes:
  pgdata:
    driver: local
